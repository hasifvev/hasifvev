name: "\U0001F4E6 Update Project Table"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repos = await github.rest.repos.listForUser({
              username: 'hasifvev',
              type: 'public',
              sort: 'pushed',
              direction: 'desc',
              per_page: 10
            });
            const projects = repos.data.filter(r => r.name !== 'hasifvev');
            const emojis = ['🔥', '⚡', '🚀', '🧠', '🎨', '🌱', '💡', '✨'];
            const sep = '|';
            let header = sep + ' ' + sep + ' Project ' + sep + ' Description ' + sep + ' Lang ' + sep + ' Stars ' + sep + ' Updated ' + sep + '\n';
            header += sep + ':---:' + sep + ':---' + sep + ':---' + sep + ':---:' + sep + ':---:' + sep + ':---:' + sep + '\n';
            let rows = '';
            projects.forEach((repo, i) => {
              const emoji = emojis[i % emojis.length];
              const desc = (repo.description || 'No description yet').replace(/\|/g, '-');
              const lang = repo.language || '—';
              const stars = repo.stargazers_count;
              const updated = new Date(repo.pushed_at).toLocaleDateString('en-MY', { month: 'short', day: 'numeric' });
              rows += sep + ' ' + emoji + ' ' + sep + ' **[' + repo.name + '](' + repo.html_url + ')** ' + sep + ' ' + desc + ' ' + sep + ' `' + lang + '` ' + sep + ' ⭐ ' + stars + ' ' + sep + ' ' + updated + ' ' + sep + '\n';
            });
            if (projects.length === 0) {
              rows = sep + ' 🌱 ' + sep + ' *No public repos yet* ' + sep + ' Building in private — stay tuned ' + sep + ' — ' + sep + ' — ' + sep + ' — ' + sep + '\n';
            }
            const table = header + rows;
            let readme = fs.readFileSync('README.md', 'utf8');
            const startMarker = '<!--START_SECTION:projects-->';
            const endMarker = '<!--END_SECTION:projects-->';
            const startIdx = readme.indexOf(startMarker);
            const endIdx = readme.indexOf(endMarker);
            if (startIdx !== -1 && endIdx !== -1) {
              readme = readme.substring(0, startIdx + startMarker.length) + '\n' + table + '\n' + readme.substring(endIdx);
              fs.writeFileSync('README.md', readme);
              core.info('Project table updated');
            } else {
              core.warning('Project markers not found in README');
            }

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: auto-update project table" && git push)
